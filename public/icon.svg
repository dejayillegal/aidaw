<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#090B0F"/>
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#252D3D" stroke-width="4"/>

  <!-- Ableton-style 4 Vertical Trigger Columns & Horizontal Bars -->
  <!-- Left: 4 Vertical Bars -->
  <rect x="110" y="170" width="22" height="172" rx="8" fill="url(#amberG)" filter="url(#glow)"/>
  <rect x="150" y="130" width="22" height="252" rx="8" fill="url(#amberG)" filter="url(#glow)"/>
  <rect x="190" y="200" width="22" height="112" rx="8" fill="url(#amberG)" filter="url(#glow)"/>
  <rect x="230" y="150" width="22" height="212" rx="8" fill="url(#amberG)" filter="url(#glow)"/>

  <!-- Right: 4 Horizontal Arrangement Blocks -->
  <rect x="280" y="150" width="122" height="22" rx="8" fill="url(#cyanG)" filter="url(#glow)"/>
  <rect x="280" y="210" width="92" height="22" rx="8" fill="url(#emeraldG)" filter="url(#glow)"/>
  <rect x="280" y="270" width="122" height="22" rx="8" fill="url(#cyanG)" filter="url(#glow)"/>
  <rect x="280" y="330" width="72" height="22" rx="8" fill="url(#emeraldG)" filter="url(#glow)"/>

  <!-- Waveform Accent at Bottom -->
  <path d="M 110 420 Q 170 390 230 420 T 350 420 T 402 420" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <circle cx="402" cy="420" r="6" fill="#38BDF8"/>
</svg>
