<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>DAW recovery browser regression</title></head>
<body>
<p>Real Chromium Web Audio export regression. No audio mocks.</p>
<script type="module">
import { buildStarterAbletonXml, parseAlsXmlString, synchronizeProjectStateToXml } from '/src/engine/alsXmlEngine.ts';
import { renderArrangementToWavBlob, synthesizeProjectToStereoFloatBuffers, shouldPlayNote } from '/src/engine/webAudioSynth.ts';
import { ProjectQueueService } from '/src/services/projectQueueService.ts';
import { executeMasterExport20 } from '/src/engine/masteringEngine.ts';

const humanization = {
  microTimingMaxShiftBeats: 0.015, swingStrength: 0, velocityVariancePct: 0.08,
  ghostVelocityMin: 20, ghostVelocityMax: 45, lfoRateHz: 0.1, lfoDepth: 0.4,
  cutoffHz: 145, macroTransition: 42,
};
const masterBus = {
  masterVolumeDb: 0, glueCompressionDrive: 0.35, reverbDecaySec: 3.2,
  reverbReturnLevel: 0.45, delayFeedback: 0.42, delayReturnLevel: 0.4,
  subBassMonoCutoffHz: 120,
};
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const ascii = (bytes, at, size) => String.fromCharCode(...new Uint8Array(bytes, at, size));
let referencePcm;
const sha256 = async (bytes) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))]
  .map((b) => b.toString(16).padStart(2, '0')).join('');

async function inspectWav(blob, expectedSampleRate, expectedBitDepth, expectedDuration, minimumMusicSeconds) {
  const bytes = await blob.arrayBuffer();
  const view = new DataView(bytes);
  assert(ascii(bytes, 0, 4) === 'RIFF' && ascii(bytes, 8, 4) === 'WAVE', 'RIFF/WAVE header invalid');
  assert(view.getUint32(4, true) === bytes.byteLength - 8, 'RIFF byte length mismatch');
  assert(view.getUint16(20, true) === (expectedBitDepth === 32 ? 3 : 1), 'WAV format mismatch');
  assert(view.getUint16(22, true) === 2, 'WAV is not stereo');
  assert(view.getUint32(24, true) === expectedSampleRate, 'WAV sample rate mismatch');
  assert(view.getUint16(34, true) === expectedBitDepth, 'WAV bit depth mismatch');
  const frames = view.getUint32(40, true) / (2 * expectedBitDepth / 8);
  assert(frames * 2 * expectedBitDepth / 8 + 44 === bytes.byteLength, 'WAV data size mismatch');
  assert(Math.abs(frames / expectedSampleRate - expectedDuration) <= 1 / expectedSampleRate, 'Encoded duration mismatch');
  assert(frames / expectedSampleRate >= minimumMusicSeconds, 'Full arrangement was truncated');

  // Decode in Chromium's real audio decoder, independently of the application's encoder.
  const ctx = new AudioContext({ sampleRate: expectedSampleRate });
  try {
    const decoded = await ctx.decodeAudioData(bytes.slice(0));
    assert(decoded.numberOfChannels === 2, 'Decoded channels mismatch');
    assert(decoded.sampleRate === expectedSampleRate, 'Decoded sample rate mismatch');
    assert(Math.abs(decoded.duration - frames / expectedSampleRate) <= 1 / expectedSampleRate, 'Decoded duration mismatch');
    const pcmCopy = decoded.getChannelData(0);
    let repeatMaxAbsoluteError = 0, repeatRmsError = 0, repeatMaxFrame = 0;
    if (referencePcm && referencePcm.length === pcmCopy.length) {
      for (let i = 0; i < pcmCopy.length; i++) {
        const difference = pcmCopy[i] - referencePcm[i];
        if (Math.abs(difference) > repeatMaxAbsoluteError) { repeatMaxAbsoluteError = Math.abs(difference); repeatMaxFrame = i; }
        repeatRmsError += difference * difference;
      }
      repeatRmsError = Math.sqrt(repeatRmsError / pcmCopy.length);
      assert(repeatMaxAbsoluteError < 0.001 && repeatRmsError < 0.0001, `Repeated render differs: max=${repeatMaxAbsoluteError}, rms=${repeatRmsError}, frame=${repeatMaxFrame}`);
    }
    referencePcm = new Float32Array(pcmCopy);
    let peak = 0;
    let nonzero = 0;
    let lastMusicalQuarterPeak = 0;
    for (let ch = 0; ch < 2; ch++) {
      const pcm = decoded.getChannelData(ch);
      const lateStart = Math.floor(minimumMusicSeconds * 0.75 * expectedSampleRate);
      const musicEnd = Math.min(pcm.length, Math.floor(minimumMusicSeconds * expectedSampleRate));
      for (let i = 0; i < pcm.length; i++) {
        assert(Number.isFinite(pcm[i]), `Non-finite decoded frame ${i}`);
        const value = Math.abs(pcm[i]);
        peak = Math.max(peak, value);
        if (value > 1e-6) nonzero++;
        if (i >= lateStart && i < musicEnd) lastMusicalQuarterPeak = Math.max(lastMusicalQuarterPeak, value);
      }
    }
    assert(peak > 1e-5 && nonzero > 100, 'Export is silent');
    assert(lastMusicalQuarterPeak > 1e-5, 'Final musical quarter is silent; late tracks may be missing');
    return { sizeBytes: bytes.byteLength, frames, sampleRate: decoded.sampleRate,
      bitDepth: expectedBitDepth, durationSeconds: decoded.duration, peak, nonzero,
      lastMusicalQuarterPeak, repeatMaxAbsoluteError, repeatRmsError, sha256: await sha256(bytes) };
  } finally { await ctx.close(); }
}

window.recovery = {
  async futureUiJournal(action) {
    const db = await new Promise((resolve, reject) => { const request = indexedDB.open('aidaw_project_queue_db_v1', 1); request.onsuccess = () => resolve(request.result); request.onerror = reject; });
    try {
      await new Promise((resolve, reject) => {
        const tx = db.transaction('queued_projects', 'readwrite'); const store = tx.objectStore('queued_projects');
        if (action === 'seed') { store.clear(); store.put({ queueId: 'future-ui', recoveryVersion: 999 }); }
        else {
          const request = store.getAll(); request.onsuccess = () => {
            const rows = request.result;
            if (rows.length !== 1 || rows[0].queueId !== 'future-ui' || rows[0].recoveryVersion !== 999) { tx.abort(); return; }
            store.clear();
          };
        }
        tx.oncomplete = resolve; tx.onabort = () => reject(new Error('Future journal was replaced or default project was silently persisted'));
      });
    } finally { db.close(); }
    return { blocked: true, futureRecordPreserved: true };
  },
  async runRecoveryCase() {
    const started = performance.now();
    const xml = buildStarterAbletonXml('berghain-134', 777, 4).xml;
    const first = new ProjectQueueService();
    const record = await first.enqueueProjectFromXml('Recovery_Fixture.als', xml);
    const baseline = record.workingProjectState;
    const edited = structuredClone(baseline); edited.tracks[0].mixer.pan = 0.2;
    edited.arrangementLengthBars = 1024;
    const stressNote = edited.tracks[0].clips[0].notes[0];
    edited.tracks[0].clips[0].length = 4096; edited.tracks[0].clips[0].endTime = 4096;
    edited.tracks[0].clips[0].notes = Array.from({ length: 4096 }, (_, i) => ({ ...stressNote, id: `recovery_${i}`, time: i + 0.25, quantizedTime: i + 0.25 }));
    edited.audioSettings = { humanization, masterBus, transport: { loopEnabled: false, loopStartBar: 1, loopLengthBars: 4, metronomeEnabled: false, followPlayhead: true, showAutomationLanes: true } };
    first.updateWorkingProjectState(record.queueId, edited); await first.flushPersistence();
    const second = new ProjectQueueService(); const restored = await second.restorePersistedProjects();
    assert(JSON.stringify(restored.tracks) === JSON.stringify(edited.tracks), 'Recovery lost canonical track state');
    assert(JSON.stringify(restored.audioSettings) === JSON.stringify(edited.audioSettings), 'Recovery lost audio settings');
    assert(restored.arrangementLengthBars === 1024 && restored.tracks[0].clips[0].notes.length === 4096, 'Large-project recovery was truncated');
    assert(parseAlsXmlString(restored.rawXmlModified).tracks[0].clips[0].notes.length === 4096, 'Recovery trusted stale XML over canonical events');
    const exposed = second.getAllItems(); exposed[0].workingProjectState.tracks = [];
    assert(second.getItem(record.queueId).workingProjectState.tracks.length > 0, 'Queue inspection leaked mutable state');
    const nativeTransaction = IDBDatabase.prototype.transaction;
    let abortNext = true;
    IDBDatabase.prototype.transaction = function(...args) {
      const transaction = nativeTransaction.apply(this, args);
      if (abortNext && args[1] === 'readwrite') { abortNext = false; queueMicrotask(() => transaction.abort()); }
      return transaction;
    };
    let aborted = false;
    try {
      const bad = structuredClone(edited); bad.tracks[0].mixer.pan = 0.9;
      first.updateWorkingProjectState(record.queueId, bad);
      try { await first.flushPersistence(); } catch (error) { aborted = String(error).includes('RECOVERY_ABORT'); }
    } finally { IDBDatabase.prototype.transaction = nativeTransaction; }
    assert(aborted, 'Aborted journal write was not reported');
    const afterAbort = await new ProjectQueueService().restorePersistedProjects();
    assert(afterAbort.tracks[0].mixer.pan === 0.2, 'Aborted write replaced the previous saved revision');
    const db = await new Promise((resolve, reject) => { const req = indexedDB.open('aidaw_project_queue_db_v1', 1); req.onsuccess = () => resolve(req.result); req.onerror = reject; });
    const mutateRow = change => new Promise((resolve, reject) => {
      const tx = db.transaction('queued_projects', 'readwrite'); const store = tx.objectStore('queued_projects'); const req = store.get(record.queueId);
      req.onsuccess = () => { const row = req.result; change(row); store.put(row); }; tx.oncomplete = resolve; tx.onabort = reject;
    });
    let primary;
    await mutateRow(row => { primary = structuredClone(row); row.checksum = 'damaged'; });
    const fallback = await new ProjectQueueService().restorePersistedProjects();
    assert(fallback.tracks[0].mixer.pan === baseline.tracks[0].mixer.pan, 'Corrupt journal did not recover its prior valid revision');
    await mutateRow(row => { Object.assign(row, primary); row.recoveryVersion = 999; });
    const futureReader = new ProjectQueueService();
    assert(await futureReader.restorePersistedProjects() === null, 'Future journal was silently downgraded');
    assert(futureReader.getPersistenceStatus().error.includes('RECOVERY_VERSION'), 'Future journal rejection missing');
    await mutateRow(row => Object.assign(row, primary)); db.close();
    for (let i = 0; i < 20; i++) {
      const next = structuredClone(edited); next.tracks[0].mixer.pan = i / 100;
      first.updateWorkingProjectState(record.queueId, next); await first.flushPersistence();
      const reader = new ProjectQueueService(); const loaded = await reader.restorePersistedProjects();
      assert(loaded.tracks[0].mixer.pan === i / 100, 'Repeated save/recovery returned a stale revision');
    }
    first.removeQueueItem(record.queueId); await first.flushPersistence();
    assert(await new ProjectQueueService().restorePersistedProjects() === null, 'Removed queue record was resurrected by recovery');
    return { scope: 'Real Chromium IndexedDB, not Android lifecycle qualification', status: 'PASS', projectBars: 1024, stressTrackNotes: 4096, repeatedCycles: 20,
      removedRecordNotResurrected: true, abortedWritePreserved: true, corruptPrimaryFallback: true, futureVersionRejected: true, wallTimeMs: performance.now() - started };
  },
  async runProbabilityCase() {
    const { xml } = buildStarterAbletonXml('berghain-134', 777, 4);
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    [...doc.querySelectorAll('Tracks > MidiTrack')].slice(1).forEach(t => t.remove());
    const source = parseAlsXmlString(new XMLSerializer().serializeToString(doc));
    source.arrangementLengthBars = 1;
    const clip = source.tracks[0].clips[0];
    clip.length = 4; clip.endTime = 4;
    clip.notes = [0, 1, 0.5, 0.25].map((probability, i) => ({
      id: `p${i}`, time: 0.25 + i * 0.5, quantizedTime: 0.25 + i * 0.5,
      duration: 0.125, pitch: 36, velocity: 100, isGhost: false, probability,
    }));
    const project = parseAlsXmlString(synchronizeProjectStateToXml(source));
    const eligible = project.tracks[0].clips[0].notes.filter(shouldPlayNote);
    assert(JSON.stringify(eligible.map(n => n.id)) === JSON.stringify(['p1', 'p2']), 'Probability event eligibility changed');
    const oracle = structuredClone(project);
    oracle.tracks[0].clips[0].notes = eligible.map(n => ({ ...n, probability: 1 }));
    const results = [];
    for (const sampleRate of [44100, 48000]) {
      const actual = await synthesizeProjectToStereoFloatBuffers(project, humanization, masterBus, sampleRate, 1);
      const expected = await synthesizeProjectToStereoFloatBuffers(oracle, humanization, masterBus, sampleRate, 1);
      assert(actual.left.length === expected.left.length, 'Probability oracle duration mismatch');
      let maxError = 0, sumSquares = 0, peak = 0;
      for (const key of ['left', 'right']) for (let i = 0; i < actual[key].length; i++) {
        assert(Number.isFinite(actual[key][i]), 'Nonfinite probability PCM');
        const difference = actual[key][i] - expected[key][i];
        peak = Math.max(peak, Math.abs(actual[key][i]));
        maxError = Math.max(maxError, Math.abs(difference)); sumSquares += difference * difference;
      }
      const rmsError = Math.sqrt(sumSquares / (actual.left.length * 2));
      assert(peak > 0.01 && maxError < 0.001 && rmsError < 0.0001, 'Probability render differs from explicit event oracle');
      results.push({ sampleRate, frames: actual.left.length, eligibleIds: eligible.map(n => n.id), peak, maxError, rmsError });
    }
    return { scope: 'Offline probability eligibility oracle; not live-loop audio capture or listening approval', results };
  },
  async runTimeoutGuardCase() {
    const NativeContext = window.OfflineAudioContext;
    const nativeTimeout = window.setTimeout;
    let allocations = 0;
    window.OfflineAudioContext = class extends NativeContext {
      constructor(...args) { super(...args); allocations++; }
      startRendering() { return new Promise(() => {}); }
    };
    window.setTimeout = (callback, delay, ...args) => nativeTimeout(callback, delay === 60000 ? 10 : delay, ...args);
    const { xml } = buildStarterAbletonXml('berghain-134', 777, 4);
    const project = parseAlsXmlString(xml);
    try {
      let timedOut = false, blocked = false;
      try { await synthesizeProjectToStereoFloatBuffers(project, humanization, masterBus, 44100, 4); }
      catch (error) { timedOut = error.message.includes('RENDER_TIMEOUT'); }
      try { await synthesizeProjectToStereoFloatBuffers(project, humanization, masterBus, 44100, 4); }
      catch (error) { blocked = error.message.includes('RENDER_BUSY'); }
      assert(timedOut && blocked && allocations === 1, 'Stalled export allowed a second context allocation');
      return { timedOut, retryBlocked: blocked, allocations };
    } finally { window.OfflineAudioContext = NativeContext; window.setTimeout = nativeTimeout; }
  },
  async runAudioCase({ bars, master = false, seed = 777 }) {
    const started = performance.now();
    const { xml } = buildStarterAbletonXml('berghain-134', seed, bars);
    const project = parseAlsXmlString(xml);
    project.arrangementLengthBars = bars;
    const musicalDuration = bars * 4 * 60 / project.tempo;
    const progress = [];
    let lastPrinted = -1;
    const result = master
      ? await executeMasterExport20(project, humanization, masterBus, {
          id: 'recovery-master-48k24', version: 2, name: 'Recovery 48 kHz 24-bit', sampleRate: 48000,
          bitDepth: 24, sampleFormat: 'pcm_int', targetIntegratedLufs: -10,
          truePeakCeilingDbtp: -1, normalize: true, dither: 'none', createdAt: '2026-11-01T00:00:00.000Z',
        })
      : await renderArrangementToWavBlob(project, humanization, masterBus, bars, 24, (pct) => {
          assert(Number.isFinite(pct) && pct >= 0 && pct <= 100, 'Invalid export progress');
          assert(!progress.length || pct >= progress.at(-1), 'Export progress regressed');
          progress.push(pct);
          const stage = Math.floor(pct / 25);
          if (stage !== lastPrinted) { console.log(`RECOVERY_STAGE ${bars} bars ${pct}%`); lastPrinted = stage; }
        });
    if (!master) {
      assert(progress[0] === 0 && progress.at(-1) === 100, 'Export progress never completed');
      assert(new Set(progress.filter((pct) => pct > 0 && pct < 75)).size >= 2,
        'No measurable completed render windows were reported');
    }
    const expectedDuration = master ? result.report.durationSeconds : result.durationSeconds;
    const verified = await inspectWav(result.blob, master ? 48000 : 44100, 24, expectedDuration, musicalDuration);
    if (master) assert(result.report.wavHeaderValid && !result.report.segmentedRenderUsed,
      'Master export did not report a valid continuous rendering');
    return { bars, seed, master, musicalDuration, ...verified,
      progressEvents: progress.length, wallTimeMs: Math.round(performance.now() - started) };
  },
};
</script>
