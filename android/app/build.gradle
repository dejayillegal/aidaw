apply plugin: 'com.android.application'

def releasePolicy = new groovy.json.JsonSlurper().parse(file('../release-policy.json'))
def metadata = new groovy.json.JsonSlurper().parse(file('../../public/apk-metadata.json'))
if (metadata.versionCode != releasePolicy.candidate.versionCode || metadata.versionName != releasePolicy.candidate.versionName || metadata.applicationId != releasePolicy.applicationId) {
    throw new GradleException('Metadata differs from the release candidate ledger')
}
if (!(metadata.versionCode instanceof Number) || metadata.versionCode <= 0 || !metadata.versionName) {
    throw new GradleException('Invalid release version identity')
}
// Unknown release history is deliberately not replaced with an invented approval.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        if (!releasePolicy.production.approved || releasePolicy.production.lastPublishedVersionCode == null || metadata.versionCode <= releasePolicy.production.lastPublishedVersionCode) {
            throw new GradleException('Production approval and monotonic release history required')
        }
    }
}

android {
    namespace = "com.parametricals.technodaw"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.parametricals.technodaw"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Canonical release identity is tracked in public/apk-metadata.json.
        // Fail configuration when Gradle and published release metadata diverge.
        def releaseMetadata = new groovy.json.JsonSlurper().parse(file('../../public/apk-metadata.json'))
        versionCode releaseMetadata.versionCode as Integer
        versionName releaseMetadata.versionName as String
        if (releaseMetadata.applicationId != applicationId) {
            throw new GradleException('APK metadata applicationId does not match Gradle applicationId')
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // Default debug keys are machine-specific, NOT a stable distribution lineage.
            // CI/distributors supply an existing persistent key; verifier pins its certificate.
            def configuredKey = System.getenv('ANDROID_DEBUG_KEYSTORE')
            if (configuredKey) {
                storeFile file(configuredKey)
                storePassword System.getenv('ANDROID_DEBUG_STORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('ANDROID_DEBUG_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('ANDROID_DEBUG_KEY_PASSWORD') ?: 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

