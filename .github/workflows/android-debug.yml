name: Android Debug APK Build & Verification

on:
  push:
    branches: [ main, fix/android-debug-apk, "remediation/**", "repair/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Verify Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOMAXPROCS: 2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Use runner Android SDK instead of a checked-in machine path
        run: rm -f android/local.properties

      - name: Install Node Dependencies
        run: npm ci

      - name: Validate TypeScript & Linting
        run: npm run lint

      - name: Run Test Suites
        run: npm test -- --maxWorkers=2

      - name: Test SDK signature output parsing
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install isolated browser test runtime
        run: |
          browser_runtime="$RUNNER_TEMP/aidaw-browser-runtime"
          npm install --prefix "$browser_runtime" --no-save --package-lock=false playwright@1.62.1
          node "$browser_runtime/node_modules/playwright/cli.js" install --with-deps chromium
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$browser_runtime/node_modules" >> "$GITHUB_ENV"

      - name: Verify real audio rendering and responsive settings
        env:
          RECOVERY_BROWSER_OUTPUT: recovery-browser-evidence
        run: |
          node scripts/inventory-ui-controls.mjs recovery-browser-evidence/ui-controls.json
          P0_AUDIO_OUTPUT=recovery-browser-evidence/p0-audio node scripts/verify-p0-audio.mjs
          node scripts/recovery-browser-check.mjs
          ARRANGEMENT_EDITING_OUTPUT=recovery-browser-evidence/arrangement-editing node scripts/arrangement-editing-check.mjs
          REFERENCE_EXPORT_OUTPUT=recovery-browser-evidence/continuous-export node scripts/reference-export-check.mjs
          REFERENCE_UI_OUTPUT=recovery-browser-evidence/continuous-export-ui node scripts/reference-export-ui-check.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-browser-evidence
          path: recovery-browser-evidence
          if-no-files-found: ignore

      - name: Generate branded launcher and PWA assets
        run: node scripts/generate-png-icons.js

      - name: Build Production Web Bundle
        run: npm run build

      - name: Sync Capacitor Android Project without nested APKs
        run: node --input-type=module -e "import { syncCapacitor } from './scripts/build-debug-apk.mjs'; syncCapacitor();"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Structure & Signatures
        run: |
          python3 scripts/verify-apk.py android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/verification.json

      - name: Compute APK SHA-256 Checksum
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parametric-techno-daw-unqualified-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/verification.json
          retention-days: 30

