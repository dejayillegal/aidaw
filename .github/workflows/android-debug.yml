name: Android Debug APK
on:
  push:
    branches: [main, 'fix/android-debug-apk*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Install dependencies
        run: npm ci
      - name: APK download regression tests
        run: npm run test:apk
      - name: Type check
        run: npm run lint
      - name: Existing workstation regressions
        run: npx vitest run src/__tests__ --environment jsdom
      - name: Build and verify real debug APK
        run: npm run build:apk
      - name: Android unit tests and lint
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and test bundled app offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell svc wifi disable
            adb shell svc data disable
            cd android && bash gradlew :app:connectedDebugAndroidTest --console=plain
      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: parametric-techno-daw-debug
          path: |
            public/parametric-techno-daw-debug.apk
            public/android-apk.json
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
